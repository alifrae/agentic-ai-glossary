name: Validate static wiki

on:
  push:
    branches:
      - main
      - feat/wiki-knowledge-pages
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate content graph
        run: python scripts/validate_content.py
