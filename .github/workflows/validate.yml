name: Validate static wiki

on:
  push:
    branches:
      - main
      - feat/wiki-knowledge-pages
      - feat/v4-personal-wiki
      - feat/v5-self-contained-entries
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check data-loader.js
          node --check wiki.js
          if [ -f v4.js ]; then node --check v4.js; fi
      - name: Check canonical JSON syntax
        run: |
          python -m json.tool wiki-content.json > /dev/null
          python -m json.tool misconceptions.json > /dev/null
          python -m json.tool glossary-7.json > /dev/null
          python -m json.tool glossary-metadata.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('content').rglob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'validated {path}')
          PY
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate V3 content graph
        run: python scripts/validate_content.py
      - name: Validate V4 content graph
        run: python scripts/validate_v4_content.py
      - name: Validate V5 content metadata
        run: python scripts/validate_v5_content.py --allow-partial-coverage
      - name: Validate public privacy boundary
        run: if [ -f scripts/validate_privacy.py ]; then python scripts/validate_privacy.py; fi
