name: Generate V5 metadata backfill

on:
  push:
    branches:
      - feat/v5-self-contained-entries

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v5-self-contained-entries
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate explicit sidecar
        run: python scripts/generate_v5_metadata.py
      - name: Require full V5 coverage before committing
        run: python scripts/validate_v5_content.py
      - name: Commit generated sidecar
        run: |
          if git diff --quiet -- glossary-metadata.json; then
            echo "Metadata sidecar is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glossary-metadata.json
          git commit -m "chore: backfill v5 metadata"
          git push origin HEAD:feat/v5-self-contained-entries
